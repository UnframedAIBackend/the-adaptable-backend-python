services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      TZ: America/Bogota
      PGTZ: America/Bogota
    networks:
      - adaptable_backend_python
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]

networks:
  adaptable_backend_python:

volumes:
  postgres_data:
